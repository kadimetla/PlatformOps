services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${PLATFORMOPS_POSTGRES_DB:-platformops_dev}
      POSTGRES_USER: ${PLATFORMOPS_POSTGRES_USER:-platformops}
      POSTGRES_PASSWORD: ${PLATFORMOPS_POSTGRES_PASSWORD:?set PLATFORMOPS_POSTGRES_PASSWORD}
    ports:
      - "${PLATFORMOPS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - platformops-postgres-data:/var/lib/postgresql/data

volumes:
  platformops-postgres-data:
